<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rimon Akhter | Under Construction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0a;
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.5);
      --text-dim: rgba(255, 255, 255, 0.28);
      --accent: #00e5ff;
      --border: rgba(255, 255, 255, 0.08);
      --ff-sans: 'Plus Jakarta Sans', sans-serif;
      --ff-mono: 'Space Mono', monospace;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ff-sans);
      cursor: crosshair;
      padding-top: 64px;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(10, 10, 10, 0.85);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-family: var(--ff-sans);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
    }

    .nav-links a {
      font-family: var(--ff-mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-toggle {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      cursor: crosshair;
      padding: 0;
    }

    .nav-toggle span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: var(--text);
      transition: transform 0.25s, opacity 0.25s;
    }

    .nav-toggle.active span:nth-child(1) {
      transform: translateY(6.5px) rotate(45deg);
    }

    .nav-toggle.active span:nth-child(2) {
      opacity: 0;
    }

    .nav-toggle.active span:nth-child(3) {
      transform: translateY(-6.5px) rotate(-45deg);
    }

    .nav-mobile {
      display: none;
      position: fixed;
      top: 64px;
      left: 0;
      right: 0;
      background: rgba(10, 10, 10, 0.97);
      border-bottom: 1px solid var(--border);
      z-index: 99;
      flex-direction: column;
    }

    .nav-mobile.open {
      display: flex;
    }

    .nav-mobile a {
      font-family: var(--ff-mono);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 14px 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.65);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-mobile a:hover {
      color: var(--text);
    }

    /* ── MAIN CONTENT ── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 32px;
    }

    .main-section {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 64px - 80px);
    }

    .center-content {
      text-align: center;
    }

    .back-link {
      font-family: var(--ff-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 80px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--accent);
    }

    .main-heading {
      font-family: var(--ff-sans);
      font-weight: 800;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--text);
      display: inline;
    }

    .blink-cursor {
      display: inline;
      color: var(--accent);
      font-family: var(--ff-sans);
      font-weight: 300;
      animation: blink 1.1s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .subtitle {
      font-family: var(--ff-sans);
      font-weight: 400;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 16px;
      line-height: 1.7;
    }

    .small-note {
      font-family: var(--ff-mono);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 48px;
      letter-spacing: 0.08em;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-name {
      font-family: var(--ff-sans);
      font-weight: 600;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .footer-copy {
      font-family: var(--ff-mono);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.28);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .nav-inner {
        padding: 0 20px;
      }

      .nav-links {
        display: none;
      }

      .nav-toggle {
        display: flex;
      }

      .container {
        padding: 0 20px;
      }

      .main-section {
        padding: 40px 0;
      }
    }

    @media (max-width: 480px) {
      .back-link {
        margin-bottom: 48px;
      }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">Rimon Akhter</a>
      <ul class="nav-links">
        <li><a href="../index.html#about">About</a></li>
        <li><a href="../index.html#experience">Experience</a></li>
        <li><a href="../index.html#work">Work</a></li>
        <li><a href="../index.html#contact">Contact</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <nav class="nav-mobile" aria-label="Mobile navigation">
    <a href="../index.html#about">About</a>
    <a href="../index.html#experience">Experience</a>
    <a href="../index.html#work">Work</a>
    <a href="../index.html#contact">Contact</a>
  </nav>

  <!-- MAIN -->
  <div class="main-section">
    <div class="container">
      <div class="center-content">
        <a href="../index.html#work" class="back-link">← Back to Work</a>
        <div>
          <h1 class="main-heading">Under Construction</h1><span class="blink-cursor">_</span>
        </div>
        <p class="subtitle">This page is still being built. Check back soon.</p>
        <p class="small-note">// more pages coming soon</p>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <div class="footer-inner">
        <span class="footer-name">Rimon Akhter</span>
        <span class="footer-copy">© 2026 — Built with care</span>
      </div>
    </div>
  </footer>

  <script>
    const toggle = document.querySelector('.nav-toggle');
    const mobileNav = document.querySelector('.nav-mobile');

    toggle.addEventListener('click', () => {
      const isOpen = mobileNav.classList.toggle('open');
      toggle.classList.toggle('active', isOpen);
      toggle.setAttribute('aria-expanded', String(isOpen));
    });

    mobileNav.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        mobileNav.classList.remove('open');
        toggle.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
</body>
</html>
