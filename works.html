<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Work - Rimon Akhter</title>
  <meta name="description" content="All games, XR work, simulations, and technical projects by Rimon Akhter." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1a1818;
      --bg-alt: #1f1d1d;
      --bg-card: #242222;
      --text: #f5f5f5;
      --text-sec: #888888;
      --text-muted: #555555;
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.14);
      --radius-card: 14px;
      --radius-btn: 8px;
      --radius-pill: 999px;
    }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
      cursor: default;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    ::selection { background: rgba(255,255,255,0.1); color: var(--text); }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }

    .container {
      width: min(1200px, 100% - 64px);
      margin: 0 auto;
    }
    #nav {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 64px;
      background: rgba(26,24,24,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .nav-logo {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 600;
      color: var(--text);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
      color: var(--text-muted);
      font-size: 14px;
    }
    .nav-links a { transition: color 0.2s ease; }
    .nav-links a:hover { color: var(--text); }

    .page-head {
      padding: 86px 0 52px;
      border-bottom: 1px solid var(--border);
    }
    .eyebrow {
      display: block;
      margin-bottom: 12px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    h1 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: clamp(3rem, 8vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .page-copy {
      max-width: 560px;
      margin-top: 24px;
      color: var(--text-sec);
      font-size: 0.98rem;
      line-height: 1.8;
    }

    .work-section {
      padding: 72px 0;
      border-bottom: 1px solid var(--border);
    }
    .work-section:nth-child(even) { background: var(--bg-alt); }
    .section-top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }
    .section-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .section-count {
      color: var(--text-muted);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .work-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }
    .proj-card {
      min-width: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .proj-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
    }
    .proj-card-img {
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: var(--bg);
    }
    .proj-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s ease;
    }
    .proj-card:hover .proj-card-img img { transform: scale(1.04); }
    .proj-card-body { padding: 14px; }
    .proj-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
    }
    .proj-genre,
    .proj-studio {
      font-size: 10px;
      color: var(--text-muted);
    }
    .proj-genre {
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .proj-studio {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .proj-card-title {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 600;
      font-size: 16px;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 7px;
    }
    .proj-card-desc {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      min-height: 58px;
      overflow: hidden;
      color: var(--text-sec);
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .proj-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .proj-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: var(--radius-btn);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .proj-btn-icon {
      width: 12px;
      height: 12px;
      display: inline-flex;
      flex: 0 0 12px;
    }
    .proj-btn-icon svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }
    .proj-btn-primary {
      background: var(--text);
      border: 1px solid var(--text);
      color: var(--bg);
    }
    .proj-btn-primary:hover {
      background: rgba(245,245,245,0.86);
      border-color: rgba(245,245,245,0.86);
    }
    .proj-btn-ghost {
      background: transparent;
      border: 1px solid var(--border-hover);
      color: var(--text-sec);
    }
    .proj-btn-ghost:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.22);
    }
    footer {
      padding: 32px 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    @media (max-width: 1024px) {
      .work-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 768px) {
      .container { width: min(100% - 40px, 1200px); }
      .nav-links { gap: 18px; font-size: 13px; }
      .page-head { padding: 64px 0 42px; }
      .section-top { align-items: start; flex-direction: column; gap: 8px; }
      .work-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    }
    @media (max-width: 520px) {
      .nav-links { display: none; }
      .work-grid { grid-template-columns: 1fr; }
      .proj-card-desc { min-height: 0; }
    }
  </style>
</head>
<body>
  <nav id="nav">
    <div class="container nav-inner">
      <a href="index.html#hero" class="nav-logo">Rimon Akhter</a>
      <ul class="nav-links">
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#experience">Experience</a></li>
        <li><a href="index.html#work">Featured</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <header class="page-head">
    <div class="container">
      <span class="eyebrow">Complete Work Archive</span>
      <h1>All Work</h1>
      <p class="page-copy">Games, XR experiences, simulations, and technical systems from professional studio work and personal development.</p>
    </div>
  </header>

  <main id="work-root"></main>

  <footer>
    <div class="container">Rimon Akhter</div>
  </footer>

  <script src="assets/js/projects.js"></script>
  <script>
  (function () {
    'use strict';

    var categories = [
      { key: 'games', title: 'Games' },
      { key: 'xrSim', title: 'XR & Simulation' },
      { key: 'tech', title: 'Tech' }
    ];

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, function (ch) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[ch];
      });
    }

    function platformType(url, explicitType) {
      if (explicitType) return explicitType;
      if (/youtube\.com|youtu\.be/.test(url)) return 'youtube';
      if (/play\.google\.com/.test(url)) return 'googleplay';
      if (/apps\.apple\.com/.test(url)) return 'ios';
      if (/itch\.io/.test(url)) return 'itchio';
      if (/store\.steampowered\.com|steam/.test(url)) return 'steam';
      if (/github\.com/.test(url)) return 'github';
      return 'link';
    }

    function platformIcon(type) {
      var icons = {
        youtube: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 7.2a3 3 0 0 0-2.1-2.1C17.6 4.6 12 4.6 12 4.6s-5.6 0-7.5.5a3 3 0 0 0-2.1 2.1C2 9.1 2 12 2 12s0 2.9.4 4.8a3 3 0 0 0 2.1 2.1c1.9.5 7.5.5 7.5.5s5.6 0 7.5-.5a3 3 0 0 0 2.1-2.1c.4-1.9.4-4.8.4-4.8s0-2.9-.4-4.8zM10 15.5v-7l6 3.5-6 3.5z"/></svg>',
        googleplay: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.2 2.8c-.3.2-.5.6-.5 1.1v16.2c0 .5.2.9.5 1.1l9.1-9.2-9.1-9.2z"/><path d="M15 10.3 6.2 1.4l11.2 6.4-2.4 2.5z"/><path d="M15 13.7 6.2 22.6l11.2-6.4-2.4-2.5z"/><path d="m16.2 12 3-1.7c.9-.5.9-1.1 0-1.6l-1.3-.8-2.8 2.9 1.1 1.2zm0 0-1.1 1.2 2.8 2.9 1.3-.8c.9-.5.9-1.1 0-1.6l-3-1.7z"/></svg>',
        ios: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.2 2.2c.1 1.1-.3 2.1-1 2.9-.8.9-1.8 1.4-2.8 1.3-.1-1.1.4-2.1 1-2.8.7-.8 1.9-1.4 2.8-1.4z"/><path d="M20.2 17.3c-.5 1.1-.8 1.6-1.5 2.5-1 1.3-2.3 2.9-4 2.9-1.5 0-1.9-.9-3.9-.9s-2.5.9-3.9.9c-1.7.1-3-1.4-4-2.8C.1 16-.2 11.5 1.7 9c1-1.3 2.5-2 3.9-2 1.5 0 2.4.9 3.7.9 1.2 0 2-.9 3.8-.9 1.3 0 2.7.7 3.7 1.9-3.3 1.8-2.7 6.5.4 7.7-.3.2-.7.5-1 .7z"/></svg>',
        itchio: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.1 2.6h15.8L22 6v1.4c0 1.3-1 2.4-2.3 2.4-1 0-1.8-.6-2.2-1.4-.4.8-1.2 1.4-2.2 1.4s-1.8-.6-2.2-1.4c-.4.8-1.2 1.4-2.2 1.4s-1.8-.6-2.2-1.4c-.4.8-1.2 1.4-2.2 1.4C3 9.8 2 8.7 2 7.4V6l2.1-3.4z"/><path d="M5.4 11.4h13.2l-.6 8.4c-.1 1-.9 1.7-1.9 1.7H7.9c-1 0-1.8-.7-1.9-1.7l-.6-8.4zm4 2.4v4.8l2.6-1.5 2.6 1.5v-4.8H9.4z"/></svg>',
        steam: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-10 9.6l5.4 2.2a2.8 2.8 0 0 1 1.6-.5l2.4-3.5v-.1a3.8 3.8 0 1 1 3.8 3.8h-.1l-3.4 2.4a2.9 2.9 0 0 1-5.6 1.1L2.2 15.4A10 10 0 1 0 12 2zm-3.3 16.5a1.4 1.4 0 0 0 1.1-2.6l-1.5-.6a1.4 1.4 0 0 0 .4 3.2zm6.5-6.8a2 2 0 1 0 0-4.1 2 2 0 0 0 0 4.1z"/></svg>',
        github: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.4-4-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 .1 1.7 1.7 3.4 1.2.1-.8.4-1.3.7-1.6-2.6-.3-5.4-1.3-5.4-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.4 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5z"/></svg>',
        link: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.4l-8.3 8.3-1.4-1.4L17.6 5H14V3z"/><path d="M5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>'
      };
      return '<span class="proj-btn-icon" aria-hidden="true">' + (icons[type] || icons.link) + '</span>';
    }

    function buildButton(link, className) {
      var type = platformType(link.url, link.type);
      return '<a href="' + escapeHtml(link.url) + '" class="proj-btn ' + className + '" target="_blank" rel="noopener noreferrer">' +
        platformIcon(type) + '<span>' + escapeHtml(link.label) + '</span></a>';
    }

    function collectLinks(project) {
      var links = project.links ? project.links.slice() : [];
      if (!links.length && project.primaryUrl && project.primaryUrl !== '#' && project.primaryLabel) {
        links.push({ url: project.primaryUrl, label: project.primaryLabel });
      }
      if (project.githubUrl) {
        links.push({ url: project.githubUrl, label: 'GitHub', type: 'github' });
      }
      return links;
    }

    function buildCard(project) {
      var imgSrc = project.videoId
        ? 'https://img.youtube.com/vi/' + project.videoId + '/hqdefault.jpg'
        : project.thumbnail;
      var links = collectLinks(project);
      var actions = links.map(function (link, index) {
        return buildButton(link, index === 0 ? 'proj-btn-primary' : 'proj-btn-ghost');
      }).join('');

      return (
        '<article class="proj-card">' +
          '<div class="proj-card-img">' +
            '<img src="' + escapeHtml(imgSrc) + '" onerror="this.onerror=null;this.src=\'' + escapeHtml(project.thumbnail) + '\'" alt="' + escapeHtml(project.title) + '" loading="lazy">' +
          '</div>' +
          '<div class="proj-card-body">' +
            '<div class="proj-card-top">' +
              '<span class="proj-genre">' + escapeHtml(project.genre) + '</span>' +
              '<span class="proj-studio">' + escapeHtml(project.studio) + '</span>' +
            '</div>' +
            '<h2 class="proj-card-title">' + escapeHtml(project.title) + '</h2>' +
            '<p class="proj-card-desc">' + escapeHtml(project.desc) + '</p>' +
            '<div class="proj-card-actions">' + actions + '</div>' +
          '</div>' +
        '</article>'
      );
    }

    function render() {
      var root = document.getElementById('work-root');
      if (!root || typeof PROJECTS === 'undefined') return;
      root.innerHTML = categories.map(function (category) {
        var projects = PROJECTS[category.key] || [];
        return (
          '<section class="work-section" id="' + category.key + '">' +
            '<div class="container">' +
              '<div class="section-top">' +
                '<h2 class="section-title">' + category.title + '</h2>' +
                '<span class="section-count">' + projects.length + ' projects</span>' +
              '</div>' +
              '<div class="work-grid">' + projects.map(buildCard).join('') + '</div>' +
            '</div>' +
          '</section>'
        );
      }).join('');
    }

    render();
  }());
  </script>
</body>
</html>
